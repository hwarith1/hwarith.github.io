<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog – Hani F. Abdel-Warith</title>
  <link rel="alternate" type="application/rss+xml"
        title="Empire State of Mind"
        href="https://hanifabdelwarith.substack.com/feed" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --ink: #1a1a1a;
      --muted: #6b6b6b;
      --hairline: #e8e8e8;
      --accent: #8b6f47;
    }
    body {
      font-family: 'EB Garamond', 'Adobe Garamond Pro', 'Garamond', 'Times New Roman', serif;
      line-height: 1.8;
      background: #ffffff;
      color: var(--ink);
      font-size: 17px;
      font-weight: 400;
    }
    header {
      border-bottom: 1px solid var(--hairline);
      padding: 25px 0;
      background: #ffffff;
    }
    .header-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .site-title {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: -0.3px;
    }
    nav ul {
      display: flex;
      list-style: none;
      gap: 35px;
    }
    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: color 0.2s ease;
      text-transform: lowercase;
    }
    nav a:hover,
    nav a.active {
      color: var(--ink);
    }
    nav a.active {
      border-bottom: 1px solid var(--ink);
      padding-bottom: 2px;
    }
    .main-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 60px 40px;
      animation: fadeIn 0.6s ease-out;
      text-align: center;
    }
    h1 {
      font-size: 2.8rem;
      font-weight: 300;
      color: var(--ink);
      margin-bottom: 50px;
      letter-spacing: -1px;
    }
    .blog-text {
      font-size: 18px;
      color: #333333;
      line-height: 1.8;
    }
    /* --- latest post block --- */
    .latest {
      margin-bottom: 60px;
    }
    .latest-label {
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
      margin-bottom: 14px;
    }
    .latest-title {
      display: inline-block;
      font-size: 1.6rem;
      font-weight: 400;
      font-style: italic;
      color: var(--ink);
      text-decoration: none;
      line-height: 1.4;
      border-bottom: 1px solid var(--hairline);
      padding-bottom: 4px;
      transition: color 0.2s ease, border-color 0.2s ease;
      max-width: 34ch;
    }
    .latest-title:hover {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .latest-subtitle {
      font-size: 16px;
      color: var(--muted);
      font-style: italic;
      margin-top: 12px;
    }
    .latest-date {
      font-size: 14px;
      color: var(--muted);
      margin-top: 10px;
      min-height: 1.4em;
    }
    .archive-link {
      display: inline-block;
      margin-top: 26px;
      font-size: 15px;
      color: var(--muted);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    .archive-link:hover {
      color: var(--ink);
      border-bottom-color: var(--hairline);
    }
    .blog-image {
      max-width: 100%;
      height: auto;
      max-height: 500px;
      border: 1px solid var(--hairline);
      display: inline-block;
    }
    footer {
      border-top: 1px solid var(--hairline);
      padding: 40px 0;
      text-align: center;
      margin-top: 80px;
    }
    .footer-text {
      font-size: 14px;
      color: var(--muted);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    a:focus {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      .main-container { animation: none; }
      * { transition: none !important; }
    }
    @media (max-width: 768px) {
      .header-container {
        padding: 0 25px;
        flex-direction: column;
        gap: 20px;
      }
      nav ul { gap: 25px; }
      .main-container { padding: 40px 25px; }
      h1 { font-size: 2.2rem; }
      .latest-title { font-size: 1.4rem; }
    }
    @media (max-width: 480px) {
      .header-container { padding: 0 20px; }
      nav ul { flex-wrap: wrap; justify-content: center; gap: 20px; }
      .main-container { padding: 30px 20px; }
      h1 { font-size: 1.9rem; }
      .site-title { font-size: 1.2rem; }
      .blog-text { font-size: 16px; }
      .latest-title { font-size: 1.25rem; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="header-container">
      <a href="index.html" class="site-title">Hani Abdel-Warith</a>
      <nav>
        <ul>
          <li><a href="index.html">about</a></li>
          <li><a href="research.html">research</a></li>
          <li><a href="teaching.html">teaching</a></li>
          <li><a href="blog.html" class="active">blog</a></li>
          <li><a href="cv.html">cv</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main-container">
    <h1>Empire State of Mind Blog</h1>

    <!-- The values below are the fallback: if the feed can't be reached,
         the page still shows a real, working link. Update them whenever a
         new post goes up, so the page is never stale even without JS. -->
    <div class="latest">
      <p class="latest-label">Latest post</p>
      <a class="latest-title"
         id="latest-title"
         href="https://hanifabdelwarith.substack.com/p/a-forgotten-massacre-on-the-island">A Forgotten Massacre on the Island of the Gods</a>
      <p class="latest-subtitle" id="latest-subtitle">Towards Ethical Tourism on Bali</p>
      <p class="latest-date" id="latest-date">September 11, 2026</p>
      <a class="archive-link" href="https://hanifabdelwarith.substack.com/archive">Read the archive on Substack &rarr;</a>
    </div>

    <img src="TahaHussein.jpg" alt="Taha Hussein" class="blog-image">
  </main>

  <footer>
    <div class="footer-text">&copy; 2026 Hani F. Abdel-Warith</div>
  </footer>

  <script>
  /* Pull the newest post from the Substack RSS feed.
     Substack doesn't send CORS headers, so the feed goes through a public
     read-only proxy. If anything fails, the hardcoded values above stay put. */
  (function () {
    var FEED = 'https://hanifabdelwarith.substack.com/feed';
    var PROXIES = [
      'https://api.allorigins.win/raw?url=',
      'https://corsproxy.io/?url='
    ];

    var titleEl    = document.getElementById('latest-title');
    var subtitleEl = document.getElementById('latest-subtitle');
    var dateEl     = document.getElementById('latest-date');

    function render(xmlText) {
      var doc  = new DOMParser().parseFromString(xmlText, 'application/xml');
      if (doc.querySelector('parsererror')) throw new Error('bad xml');
      var item = doc.querySelector('channel > item');
      if (!item) throw new Error('no items');

      var title = item.querySelector('title');
      var link  = item.querySelector('link');
      var date  = item.querySelector('pubDate');
      if (!title || !link) throw new Error('incomplete item');

      titleEl.textContent = title.textContent.trim();
      /* Strip Substack's share/tracking query string so the link stays clean. */
      titleEl.href = link.textContent.trim().split('?')[0];

      /* Substack puts the deck in <description>; show it when there is one,
         otherwise leave whatever is already on the page. */
      var desc = item.querySelector('description');
      if (subtitleEl && desc) {
        var tmp = document.createElement('div');
        tmp.innerHTML = desc.textContent;
        var text = (tmp.textContent || '').trim().replace(/\s+/g, ' ');
        if (text) subtitleEl.textContent = text.length > 140
          ? text.slice(0, 139).replace(/\s+\S*$/, '') + '…'
          : text;
      }

      if (date) {
        var d = new Date(date.textContent);
        if (!isNaN(d)) {
          dateEl.textContent = d.toLocaleDateString('en-US', {
            year: 'numeric', month: 'long', day: 'numeric'
          });
        }
      }
    }

    function attempt(i) {
      if (i >= PROXIES.length) return;           // give up, keep the fallback
      fetch(PROXIES[i] + encodeURIComponent(FEED), { cache: 'no-store' })
        .then(function (r) {
          if (!r.ok) throw new Error(r.status);
          return r.text();
        })
        .then(render)
        .catch(function () { attempt(i + 1); }); // try the next proxy
    }

    attempt(0);
  })();
  </script>
</body>
</html>
